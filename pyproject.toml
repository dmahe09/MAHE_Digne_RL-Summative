[project]
name = "mahe-digne-rl-summative"
version = "1.0.0"
description = "Rwanda Entrepreneurship Journey Simulator - DQN, REINFORCE, A2C and PPO with TorchRL"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5",
    "torchrl>=0.7",
    "tensordict>=0.7",
    "gymnasium>=1.0",
    "pygame>=2.5",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "imageio>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
